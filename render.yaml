services:
  - type: web
    name: sell-premium
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: PUBLIC_CHANNEL_ID
        sync: false
      - key: PRIVATE_CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: BKASH_NUMBER
        sync: false
      - key: NAGAD_NUMBER
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: PORT
        value: "8000"
      - key: USE_POLLING
        value: "true"
      - key: SEED_DEMO
        value: "true"
    git:
      branch: main
      repoName: RahatCodes7/xerodel