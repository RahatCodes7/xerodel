<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin — {{ site.site_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin">
<a class="skip-link" href="#admin-content">Skip to content</a>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 5.5 18h13L22 8.5l-4.5 3L12 5l-5.5 6.5z"/><path d="M5.5 21h13"/></svg>
      </span>
      <span>{{ site.site_name }}</span>
    </div>
    <span class="sidebar-label">Management</span>
    <nav aria-label="Admin navigation">
      <a href="/admin" class="{% if active == 'dashboard' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span>
        <span>Dashboard</span>
      </a>
      <a href="/admin/products" class="{% if active == 'products' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg></span>
        <span>Products</span>
      </a>
      <a href="/admin/inventory" class="{% if active == 'inventory' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span>
        <span>Inventory</span>
      </a>
      <a href="/admin/orders" class="{% if active == 'orders' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.4-1.6-2.3 1.6-2.3-1.6L5 20.5z"/><path d="M9 8.5h6M9 12.5h6"/></svg></span>
        <span>Orders</span>
      </a>
      <a href="/admin/payments" class="{% if active == 'payments' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.4"/><path d="M2.5 10h19"/></svg></span>
        <span>Payments</span>
        <span id="pending-count" class="pill"></span>
      </a>
      <a href="/admin/settings" class="{% if active == 'settings' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.4-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 9 4.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
        <span>Settings</span>
      </a>
      <a href="/admin/audit" class="{% if active == 'audit' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 0 4.2 15.9"/><path d="M12 8v4.4l3 1.8"/><path d="M20.5 15.5v5l2 1"/></svg></span>
        <span>Audit log</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <a href="/">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        View site
      </a>
      <a href="/logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4.5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg>
        Logout
      </a>
    </div>
  </aside>
  <main class="content" id="admin-content">
    {% block content %}{% endblock %}
  </main>
</div>
<div id="toasts" aria-live="polite" aria-atomic="true"></div>
<script src="/static/js/admin_payments.js"></script>
<script src="/static/js/ui.js"></script>
<script>
  /* Lightweight client-side table filter: <input data-filter="#table-id"> */
  (function () {
    document.querySelectorAll('input[data-filter]').forEach(function (input) {
      var target = document.querySelector(input.getAttribute('data-filter'));
      if (!target) return;
      var items = target.tagName === 'TABLE'
        ? Array.prototype.slice.call(target.querySelectorAll('tbody tr'))
        : Array.prototype.slice.call(target.children);
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        items.forEach(function (item) {
          item.style.display = !q || item.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
        });
      });
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
